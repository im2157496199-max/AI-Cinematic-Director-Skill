reference_case_registries:
  - registry_id: appvikalabs_ltx2_workflows
    model_family: ltx2
    source_kind: community_reference_case
    source_url: https://github.com/appvikalabs/LTX-2-Workflows
    catalog_ref: ../video_engine/ltx2/catalog/appvikalabs_workflow_catalog.json
    verification_status: STATIC_STUDY_ONLY
    production_ready: false
    use_for:
      - capability_selection
      - graph_pattern_learning
      - dependency_recognition
      - semantic_anchor_discovery
    do_not_use_for:
      - direct_prompt_submission
      - runtime_compatibility_claim
      - automatic_model_swap

selection_policy:
  production_min_status: REGRESSION_PASS
  allow_candidate_for_planning: true
  allow_community_reference_for_planning: true
  community_reference_never_equals_production_profile: true
  do_not_invent_missing_profile: true
  prefer_user_run_verified_over_unverified_official: true
  prefer_current_official_over_legacy_community_when_no_user_profile: true
